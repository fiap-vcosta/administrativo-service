apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: administrativo-service
  namespace: tech-challenge
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: administrativo-service
  minReplicas: 1
  maxReplicas: 2
  metrics:
    - type: ContainerResource
      containerResource:
        name: cpu
        container: administrativo-service
        target:
          type: Utilization
          averageUtilization: 50
    - type: ContainerResource
      containerResource:
        name: memory
        container: administrativo-service
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 2
          periodSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 1
          periodSeconds: 30
